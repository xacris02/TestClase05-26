name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk CLI
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      - name: Snyk test Java dependencies
        run: |
          snyk test --file=microservicioEvaluacion-develop/microservicioEvaluacion-develop/SmokeGameBack/pom.xml --severity-threshold=high || echo "Vulnerabilidades detectadas"

      - name: Generate Snyk JSON Report
        if: always()
        run: |
          snyk test --file=microservicioEvaluacion-develop/microservicioEvaluacion-develop/SmokeGameBack/pom.xml --json > snyk-report.json || true

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

  test:
    name: Run Tests with JaCoCo
    runs-on: ubuntu-latest
    needs: snyk-scan
    defaults:
      run:
        working-directory: microservicioEvaluacion-develop/microservicioEvaluacion-develop/SmokeGameBack
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and test
        run: mvn clean verify

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: microservicioEvaluacion-develop/microservicioEvaluacion-develop/SmokeGameBack/target/site/jacoco/

  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: microservicioEvaluacion-develop/microservicioEvaluacion-develop/SmokeGameBack
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
          -Dsonar.projectKey=xacris02_TestClase05-26 \
          -Dsonar.organization=xacris02 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  build:
    name: Build Jar
    runs-on: ubuntu-latest
    needs: sonar-analysis
    defaults:
      run:
        working-directory: microservicioEvaluacion-develop/microservicioEvaluacion-develop/SmokeGameBack
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Package application
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: microservicioEvaluacion-develop/microservicioEvaluacion-develop/SmokeGameBack/target/*.jar
